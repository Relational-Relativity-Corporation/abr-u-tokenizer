[package]
name = "abr-u-tokenizer"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "abr_u_tokenizer"
path = "src/main.rs"

[lib]
name = "abr_u_tokenizer"
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
# no external test deps needed
